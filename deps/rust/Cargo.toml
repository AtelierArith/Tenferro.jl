[package]
name = "tenferro-julia"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustcall_julia_macros = "0.6"
tenferro-ad = { version = "0.9.0", path = "../../extern/tenferro-rs/crates/tenferro-ad" }
tenferro-linalg = { version = "0.9.0", path = "../../extern/tenferro-rs/crates/tenferro-linalg", features = ["autodiff"] }
tenferro-cpu = { version = "0.9.0", path = "../../extern/tenferro-rs/crates/tenferro-cpu" }
tenferro-runtime = { version = "0.9.0", path = "../../extern/tenferro-rs/crates/tenferro-runtime" }
tenferro-tensor = { version = "0.9.0", path = "../../extern/tenferro-rs/crates/tenferro-tensor" }

num-complex = "0.4"
