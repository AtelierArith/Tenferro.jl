[package]
name = "tenferro-julia"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustcall_julia_macros = "0.5"
tenferro-ad = { path = "../../extern/tenferro-rs/crates/tenferro-ad" }
tenferro-linalg = { path = "../../extern/tenferro-rs/crates/tenferro-linalg", features = ["autodiff"] }
tenferro-cpu = { path = "../../extern/tenferro-rs/crates/tenferro-cpu" }
tenferro-runtime = { path = "../../extern/tenferro-rs/crates/tenferro-runtime" }
tenferro-tensor = { path = "../../extern/tenferro-rs/crates/tenferro-tensor" }

num-complex = "0.4"
