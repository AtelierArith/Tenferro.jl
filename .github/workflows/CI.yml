name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(; workspace=true)'
      - name: Test
        run: julia --project -e 'using Pkg; Pkg.test(; test_args=["--jobs=2"])'
      - name: Build and deploy documentation
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.DOCUMENTER_KEY || '' }}
