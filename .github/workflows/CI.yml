name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project -e 'using Pkg; Pkg.instantiate(; workspace=true)'
      - name: Test
        run: julia --project -e 'using Pkg; Pkg.test(; test_args=["--jobs=2"])'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
